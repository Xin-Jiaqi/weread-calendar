[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weread-calendar"
version = "0.1.0a1"
description = "Privacy-conscious local reading calendar and report generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jiaqi Xin"}]
dependencies = ["requests>=2.32,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
image = ["pillow>=10,<13"]
browser = ["playwright>=1.45,<2"]
test = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
weread-calendar = "weread_export_fixed_v13:main"

[tool.setuptools]
py-modules = ["weread_export_fixed_v13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
